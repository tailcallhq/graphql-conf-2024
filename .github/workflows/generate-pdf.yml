name: Generate PDF from Slides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build slides
        run: npm run build || echo "No build step needed"

      - name: Start dev server and generate PDF
        run: |
          # Start the dev server in background
          npm run dev &
          SERVER_PID=$!
          
          # Wait for server to be ready
          for i in $(seq 1 30); do
            curl -s http://localhost:3030 > /dev/null 2>&1 && break
            curl -s http://localhost:3000 > /dev/null 2>&1 && break
            sleep 2
          done
          
          # Detect which port is running
          PORT=3030
          curl -s http://localhost:3030 > /dev/null 2>&1 || PORT=3000
          
          # Use Playwright to generate PDF
          npx playwright-core screenshot --browser chromium --full-page --type pdf "http://localhost:$PORT" slides.pdf || \
          npx -y decktape reveal "http://localhost:$PORT" slides.pdf || \
          npx -y decktape automatic "http://localhost:$PORT" slides.pdf
          
          # Stop the server
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: slides.pdf
          if-no-files-found: error
