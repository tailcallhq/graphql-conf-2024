<!DOCTYPE html>
<html>
  <head>
    <title>Scaling GraphQL for the Millions | Tailcall</title>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="./app.css" />
    <script>
      // Google Analytics script
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );

      // Initialize GA with your tracking ID
      ga("create", "G-JEP3QDWT0G", "auto");
      ga("send", "pageview");
    </script>
  </head>
  <body>
    <textarea id="source"> </textarea>

    <script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
    <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
    <script>
      // ---------------------------------------------------------------------------
      // Configuration
      // ---------------------------------------------------------------------------
      var CONFIG = {
        // Bottom-right corner of every slide:
        //   "none"    nothing
        //   "number"  slide number (e.g. 12 / 29)
        //   "preview" tiny preview of the next slide
        // Override per visit with ?footer=none|number|preview in the URL.
        footer: "number",
        // Size of the next-slide preview, as a fraction of the slide.
        previewScale: 0.08,
      };
      var FOOTERS = ["none", "number", "preview"];
      var footerParam = new URLSearchParams(location.search).get("footer");
      var footer = FOOTERS.indexOf(footerParam) >= 0 ? footerParam : CONFIG.footer;
      document.body.dataset.footer = footer;

      // Pick the deck from ?deck=<name> → ./<name>.md (defaults to index.md, the deck list).
      var deck = new URLSearchParams(location.search).get("deck") || "index";
      if (!/^[\w-]+$/.test(deck)) deck = "index";
      // Lets app.css style one deck without touching the others.
      document.body.dataset.deck = deck;
      // `.icon[sparkles]` → Lucide "sparkles" icon (names: https://lucide.dev/icons).
      // Remark renders it as <span class="icon">sparkles</span>; swap the text for the SVG.
      function renderIcons() {
        document.querySelectorAll(".icon").forEach(function (el) {
          var name = el.textContent.trim();
          if (el.children.length || !/^[a-z0-9-]+$/.test(name)) return;
          el.innerHTML = '<i data-lucide="' + name + '"></i>';
        });
        lucide.createIcons();
      }

      // The deck markdown loads asynchronously; the callback fires once slides are in the DOM.
      var slideshow = remark.create(
        {
          sourceUrl: "./" + deck + ".md",
          highlightStyle: "tomorrow-night",
          ratio: "16:9",
          navigation: {
            scroll: false,
            click: false,
          },
          countIncrementalSlides: false,
        },
        function () {
          renderIcons();
          reserveIncrementalSpace();
        }
      );

      // `--` builds: remark renders each step as its own slide holding only the
      // content revealed so far, so centred layouts re-centre on every step.
      // Give each step the not-yet-revealed content from the final step, hidden,
      // so every step lays out exactly like the finished slide and nothing moves.
      function reserveIncrementalSpace() {
        var slides = slideshow.getSlides();
        var contents = document.querySelectorAll(".remark-slide-content");
        var blocks = function (el) {
          return Array.prototype.filter.call(el.children, function (c) {
            return !c.classList.contains("remark-slide-number");
          });
        };
        for (var i = 0; i < slides.length; i++) {
          // Find the last step of the group that starts here.
          var last = i;
          while (last + 1 < slides.length && slides[last + 1].properties.continued === "true") last++;
          var full = blocks(contents[last]);
          for (var j = i; j < last; j++) {
            var shown = blocks(contents[j]).length;
            var number = contents[j].querySelector(".remark-slide-number");
            full.slice(shown).forEach(function (b) {
              var ghost = b.cloneNode(true);
              ghost.classList.add("incremental-pending");
              ghost.setAttribute("aria-hidden", "true");
              contents[j].insertBefore(ghost, number);
            });
          }
          i = last;
        }
      }

      // Remark builds every slide at load, so SVG animations would start (and one-shot
      // ones finish) before their slide is shown. Reload the slide's SVG images on show
      // so each animation starts from the beginning when the slide appears.
      // `--` steps of one slide share a build group; moving between them keeps the
      // running animations instead of restarting them.
      function groupOf(index) {
        var slides = slideshow.getSlides();
        while (index > 0 && slides[index].properties.continued === "true") index--;
        return index;
      }
      function svgImages(container) {
        return Array.prototype.filter.call(
          container.querySelectorAll('img[src*=".svg"]:not(.celebrate-overlay)'),
          function (img) {
            return !img.closest(".incremental-pending") && !img.closest(".slide-preview");
          }
        );
      }
      // The real slides only (not the copies inside the next-slide preview).
      function slideContents() {
        return Array.prototype.filter.call(
          document.querySelectorAll(".remark-slide-content"),
          function (el) {
            return !el.closest(".slide-preview");
          }
        );
      }

      // Bottom right: a tiny live preview of the next slide (instead of the slide
      // number). `--` steps of the current slide are skipped, so it always shows the
      // next real slide; the last slide shows nothing.
      var PREVIEW_SCALE = CONFIG.previewScale;
      function showNextPreview(index) {
        document.querySelectorAll(".slide-preview").forEach(function (el) {
          el.remove();
        });
        if (footer !== "preview") return;
        var slides = slideshow.getSlides();
        var contents = slideContents();
        var next = index + 1;
        while (next < slides.length && slides[next].properties.continued === "true") next++;
        if (next >= slides.length) return;
        var host = contents[index];
        var w = host.offsetWidth;
        var h = host.offsetHeight;
        var box = document.createElement("div");
        box.className = "slide-preview";
        box.setAttribute("aria-hidden", "true");
        box.style.width = w * PREVIEW_SCALE + "px";
        box.style.height = h * PREVIEW_SCALE + "px";
        var inner = document.createElement("div");
        inner.className = "slide-preview-inner";
        inner.style.width = w + "px";
        inner.style.height = h + "px";
        inner.style.transform = "scale(" + PREVIEW_SCALE + ")";
        var copy = contents[next].cloneNode(true);
        copy.querySelectorAll(".remark-slide-number, .celebrate-overlay").forEach(function (el) {
          el.remove();
        });
        inner.appendChild(copy);
        box.appendChild(inner);
        host.appendChild(box);
      }
      var lastIndex = null;
      slideshow.on("afterShowSlide", function (slide) {
        var index = slide.getSlideIndex();
        showNextPreview(index);
        var contents = slideContents();
        var current = svgImages(contents[index]);
        if (lastIndex !== null && lastIndex !== index && groupOf(lastIndex) === groupOf(index)) {
          // Same slide, next/previous build step: move the playing images across.
          var playing = svgImages(contents[lastIndex]);
          current.forEach(function (img, k) {
            var src = playing[k] && playing[k].getAttribute("src").split("?")[0];
            if (src && src === img.getAttribute("src").split("?")[0]) {
              var placeholder = playing[k].cloneNode();
              playing[k].replaceWith(placeholder);
              img.replaceWith(playing[k]);
            }
          });
          lastIndex = index;
          return;
        }
        lastIndex = index;
        current.forEach(function (img) {
            // A fresh element (not just a new src) gets its own animation timeline.
            var fresh = img.cloneNode();
            fresh.src = img.getAttribute("src").split("?")[0] + "?t=" + Date.now();
            img.replaceWith(fresh);
          });
        // `class: celebrate` slides get a fresh confetti burst on every show.
        document.querySelectorAll(".celebrate-overlay").forEach(function (el) {
          el.remove();
        });
        var slide = contents[index];
        if (slide.classList.contains("celebrate")) {
          var burst = document.createElement("img");
          burst.className = "celebrate-overlay";
          burst.alt = "";
          burst.src = "./img/confetti.svg?t=" + Date.now();
          slide.appendChild(burst);
        }
      });
    </script>
  </body>
</html>
