<!DOCTYPE html>
<html>
  <head>
    <title>Scaling GraphQL for the Millions | Tailcall</title>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap"
    />
    <link rel="stylesheet" href="./app.css" />
    <script>
      // Google Analytics script
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );

      // Initialize GA with your tracking ID
      ga("create", "G-JEP3QDWT0G", "auto");
      ga("send", "pageview");
    </script>
  </head>
  <body>
    <textarea id="source"> </textarea>

    <script src="https://remarkjs.com/downloads/remark-latest.min.js"></script>
    <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
    <script>
      // Pick the deck from ?deck=<name> → ./<name>.md (defaults to index.md, the deck list).
      var deck = new URLSearchParams(location.search).get("deck") || "index";
      if (!/^[\w-]+$/.test(deck)) deck = "index";
      // Lets app.css style one deck without touching the others.
      document.body.dataset.deck = deck;
      // `.icon[sparkles]` → Lucide "sparkles" icon (names: https://lucide.dev/icons).
      // Remark renders it as <span class="icon">sparkles</span>; swap the text for the SVG.
      function renderIcons() {
        document.querySelectorAll(".icon").forEach(function (el) {
          var name = el.textContent.trim();
          if (el.children.length || !/^[a-z0-9-]+$/.test(name)) return;
          el.innerHTML = '<i data-lucide="' + name + '"></i>';
        });
        lucide.createIcons();
      }

      // The deck markdown loads asynchronously; the callback fires once slides are in the DOM.
      var slideshow = remark.create(
        {
          sourceUrl: "./" + deck + ".md",
          highlightStyle: "tomorrow-night",
          ratio: "16:9",
          navigation: {
            scroll: false,
            click: false,
          },
          countIncrementalSlides: false,
        },
        function () {
          renderIcons();
          reserveIncrementalSpace();
        }
      );

      // `--` builds: remark renders each step as its own slide holding only the
      // content revealed so far, so centred layouts re-centre on every step.
      // Give each step the not-yet-revealed content from the final step, hidden,
      // so every step lays out exactly like the finished slide and nothing moves.
      function reserveIncrementalSpace() {
        var slides = slideshow.getSlides();
        var contents = document.querySelectorAll(".remark-slide-content");
        var blocks = function (el) {
          return Array.prototype.filter.call(el.children, function (c) {
            return !c.classList.contains("remark-slide-number");
          });
        };
        for (var i = 0; i < slides.length; i++) {
          // Find the last step of the group that starts here.
          var last = i;
          while (last + 1 < slides.length && slides[last + 1].properties.continued === "true") last++;
          var full = blocks(contents[last]);
          for (var j = i; j < last; j++) {
            var shown = blocks(contents[j]).length;
            var number = contents[j].querySelector(".remark-slide-number");
            full.slice(shown).forEach(function (b) {
              var ghost = b.cloneNode(true);
              ghost.classList.add("incremental-pending");
              ghost.setAttribute("aria-hidden", "true");
              contents[j].insertBefore(ghost, number);
            });
          }
          i = last;
        }
      }

      // Remark builds every slide at load, so SVG animations would start (and one-shot
      // ones finish) before their slide is shown. Reload the slide's SVG images on show
      // so each animation starts from the beginning when the slide appears.
      slideshow.on("afterShowSlide", function () {
        document
          .querySelectorAll('.remark-visible img[src*=".svg"]')
          .forEach(function (img) {
            // A fresh element (not just a new src) gets its own animation timeline.
            var fresh = img.cloneNode();
            fresh.src = img.getAttribute("src").split("?")[0] + "?t=" + Date.now();
            img.replaceWith(fresh);
          });
        // `class: celebrate` slides get a fresh confetti burst on every show.
        document.querySelectorAll(".celebrate-overlay").forEach(function (el) {
          el.remove();
        });
        var slide = document.querySelector(".remark-visible .remark-slide-content.celebrate");
        if (slide) {
          var burst = document.createElement("img");
          burst.className = "celebrate-overlay";
          burst.alt = "";
          burst.src = "./img/confetti.svg?t=" + Date.now();
          slide.appendChild(burst);
        }
      });
    </script>
  </body>
</html>
