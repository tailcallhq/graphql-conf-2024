<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 446" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- A software factory: a closed loop from idea to monitor (Triage, Spec, Implement, Verify, Ship, Monitor). Work flows round it continuously; humans only review at three checkpoints (spec, code, product), which light up as work passes. SMIL only, 9s loop -->
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="rgba(255,255,255,0.8)"/></marker></defs>
