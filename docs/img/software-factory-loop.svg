<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 446" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- A software factory: a closed loop from idea to monitor (Triage, Spec, Implement, Verify, Ship, Monitor). Work items (cyan dots) flow round the full circle continuously; humans only review at three checkpoints (spec, code, product), which light up as work passes. SMIL only, 9s loop -->
  <g transform="translate(382 14) scale(1.0)" fill="none" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <text x="414" y="32" font-size="15" font-weight="700" letter-spacing="1" fill="#d8d8d8">New Idea or Bug</text>
