  <text x="500" y="228" text-anchor="middle" font-size="28" font-weight="700" fill="#f2f2f2">Software</text>
  <text x="500" y="260" text-anchor="middle" font-size="28" font-weight="700" fill="#f2f2f2">Factory</text>
