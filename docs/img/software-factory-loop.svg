  <g transform="translate(486 12) scale(1.17)" fill="none" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
  <text x="500" y="72" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#d8d8d8">New Idea or Bug</text>
