<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 20 360 330" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Agent: LLM, tools and user sit on one circle. A message travels clockwise
       LLM -> tools -> user -> LLM, lighting each node as it arrives.
       Nodes sit at 0, 1/3 and 2/3 of the path, so arrivals are at those times. -->
  <defs>
    <path id="ring" d="M240 60 A110 110 0 0 1 240 280 A110 110 0 0 1 240 60"/>
  </defs>

  <!-- Loop track -->
  <use href="#ring" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-dasharray="4 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  </use>

  <!-- Message: one packet laps the circle every 3s -->
  <circle r="6" fill="#f97316">
    <animateMotion dur="3s" begin="-0.5s" repeatCount="indefinite"><mpath href="#ring"/></animateMotion>
  </circle>

  <!-- LLM (top) -->
  <g transform="translate(240 60)">
    <circle r="50" fill="#f97316" opacity="0.15">
      <animate attributeName="r" values="56;40;40;56" keyTimes="0;0.3;0.97;1" dur="3s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="-62" y="-28" width="124" height="56" rx="0" fill="#f97316"/>
    <text y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#000">LLM</text>
  </g>

  <!-- Tools (bottom right) -->
  <g transform="translate(335 225)">
    <rect x="-56" y="-26" width="112" height="52" rx="0" fill="#141414" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="-56" y="-26" width="112" height="52" rx="0" fill="rgba(249,115,22,0.12)" stroke="#f97316" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.33;0.34;0.55;1" dur="3s" begin="-0.5s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(-36.8 -7.6) scale(0.767)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" /></g><text y="6" font-size="16" font-weight="700" fill="#f97316" x="-11.2">Tools</text>
  </g>

  <!-- User (bottom left) -->
  <g transform="translate(145 225)">
    <rect x="-56" y="-26" width="112" height="52" rx="0" fill="#141414" stroke="#fff" stroke-width="1.5" stroke-opacity="0.65"/>
    <rect x="-56" y="-26" width="112" height="52" rx="0" fill="rgba(255,255,255,0.1)" stroke="#fff" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.66;0.67;0.88;1" dur="3s" begin="-0.5s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(-32.0 -7.6) scale(0.767)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /> <circle cx="12" cy="7" r="4" /></g><text y="6" font-size="16" font-weight="700" fill="#fff" x="-6.4">User</text>
  </g>

  <!-- Context: one chip per lap, resets after five -->
  <g transform="translate(90 312)">
    <text x="0" y="-10" font-size="12" fill="#c8c8c8">Context</text>
    <rect x="0" y="0" width="300" height="22" rx="0" fill="#111" stroke="rgba(255,255,255,0.15)"/>
    <g fill="#f97316">
      <rect x="4"   y="4" width="52" height="14" rx="0"/>
      <rect x="62"  y="4" width="52" height="14" rx="0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.199;0.2;1" dur="15s" begin="-0.5s" repeatCount="indefinite"/></rect>
      <rect x="120" y="4" width="52" height="14" rx="0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.399;0.4;1" dur="15s" begin="-0.5s" repeatCount="indefinite"/></rect>
      <rect x="178" y="4" width="52" height="14" rx="0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.599;0.6;1" dur="15s" begin="-0.5s" repeatCount="indefinite"/></rect>
      <rect x="236" y="4" width="52" height="14" rx="0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.799;0.8;1" dur="15s" begin="-0.5s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
