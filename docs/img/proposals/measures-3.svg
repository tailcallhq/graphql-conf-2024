<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Title: Cycle Time Gauge | Concept: Every item is timed from Start to Shipped, and that cycle time, not effort, is the needle the factory steers by. -->
  <!-- Items cross from a Start gate to a Shipped gate; slow items crawl early in the loop and fast ones zip later. Each arrival swings the gauge needle to that item's cycle time and updates the readout. SMIL only, 12s loop -->
