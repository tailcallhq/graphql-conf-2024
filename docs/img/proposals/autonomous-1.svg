<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Title: Agent Loop | Concept: A single agent cycles Pick, Code, Test, Review, Merge, Ship on its own and every lap drops a shipped change onto Main, with nobody pushing it round. SMIL only, 6s loop -->
