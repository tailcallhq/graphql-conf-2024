<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Title: Raising The Bar | Concept: Each cycle the quality bar steps higher and the work still clears it. SMIL only, 12s loop -->
  <path d="M60 240 H940" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
  <text x="560" y="272" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#22d3ee">Quality Bar</text>
  <rect x="480" y="80" width="6" height="160" rx="3" fill="#262626"/>
  <rect x="634" y="80" width="6" height="160" rx="3" fill="#262626"/>
  <rect x="470" y="200" width="180" height="8" rx="4" fill="#22d3ee"><animate attributeName="y" values="200;200;165;165;130;130;95;95;200" keyTimes="0.0000;0.2125;0.2500;0.4625;0.5000;0.7125;0.7500;0.9625;1.0000" dur="12s" begin="-2s" repeatCount="indefinite"/></rect>
  <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#f97316" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0050;0.1900;0.2000;1" dur="12s" begin="-2s" repeatCount="indefinite"/><animateMotion path="M90 226 H360 C360 131 760 131 760 226 H910" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.2000;1" calcMode="linear" dur="12s" begin="-2s" repeatCount="indefinite"/></rect>
  <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#f97316" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2550;0.4400;0.4500;1" dur="12s" begin="-2s" repeatCount="indefinite"/><animateMotion path="M90 226 H360 C360 85 760 85 760 226 H910" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.4500;1" calcMode="linear" dur="12s" begin="-2s" repeatCount="indefinite"/></rect>
  <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#f97316" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5050;0.6900;0.7000;1" dur="12s" begin="-2s" repeatCount="indefinite"/><animateMotion path="M90 226 H360 C360 38 760 38 760 226 H910" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.7000;1" calcMode="linear" dur="12s" begin="-2s" repeatCount="indefinite"/></rect>
  <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#f97316" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7550;0.9400;0.9500;1" dur="12s" begin="-2s" repeatCount="indefinite"/><animateMotion path="M90 226 H360 C360 -9 760 -9 760 226 H910" keyPoints="0;0;1;1" keyTimes="0;0.7500;0.9500;1" calcMode="linear" dur="12s" begin="-2s" repeatCount="indefinite"/></rect>
  <text x="560" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#d8d8d8" opacity="0">v1<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.2500;1" dur="12s" begin="-2s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="560" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#d8d8d8" opacity="0">v2<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2500;0.5000;1" dur="12s" begin="-2s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="560" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#d8d8d8" opacity="0">v3<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5000;0.7500;1" dur="12s" begin="-2s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="560" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#d8d8d8" opacity="0">v4<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.7500;1" dur="12s" begin="-2s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="90" y="270" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6b6b6b">Work</text>
  <text x="910" y="270" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6b6b6b">Shipped</text>
</svg>
