  <rect x="582" y="84" width="36" height="72" rx="5" fill="#ef4444" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.22;0.23;0.30;0.33;1" dur="8s" begin="-1s" repeatCount="indefinite"/></rect>
