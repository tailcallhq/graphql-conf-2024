    <rect x="355" y="246" width="120" height="30" rx="5" fill="#1a1a1a"/>
    <text x="415" y="267" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#22d3ee">+1 Rule</text>
  </g>
