<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Title: Caught, Ruled, Passed | Concept: A work item fails Checks and rides the feedback loop back into the Agent as a new rule, so the identical next item passes and ships. SMIL only, 8s loop -->
