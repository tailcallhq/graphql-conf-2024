  <rect x="-13" y="-13" width="26" height="26" rx="5" fill="#f97316" opacity="0"><animate attributeName="fill" values="#f97316;#f97316;#22d3ee;#22d3ee" keyTimes="0;0.72;0.73;1" dur="8s" begin="-1s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.57;0.92;0.97;1" dur="8s" begin="-1s" repeatCount="indefinite"/><animateMotion path="M230 120 H930" keyPoints="0;0;0.5286;0.5286;1;1" keyTimes="0;0.56;0.72;0.76;0.94;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1" dur="8s" begin="-1s" repeatCount="indefinite"/></rect>
  <rect x="150" y="84" width="160" height="72" rx="6" fill="#1a1a1a"/>
  <rect x="150" y="84" width="160" height="72" rx="6" fill="#22d3ee" fill-opacity="0.18" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.52;0.56;0.72;1" dur="8s" begin="-1s" repeatCount="indefinite"/></rect>
  <g transform="translate(172.0 106.0) scale(1.167)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g>
