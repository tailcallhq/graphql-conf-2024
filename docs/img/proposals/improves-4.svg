<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Title: Flywheel | Concept: A Ship, Measure, Learn, Update flywheel spins faster each lap while Cycle Time and Failures shrink and Quality grows. SMIL only, 9.5s loop -->
  <circle cx="250" cy="150" r="92" fill="none" stroke="#262626" stroke-width="16"/>
  <text x="250" y="32" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Ship</text>
  <circle cx="250" cy="58" r="4" fill="#6b6b6b"/>
  <text x="366" y="156" text-anchor="start" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Measure</text>
  <circle cx="342" cy="150" r="4" fill="#6b6b6b"/>
  <text x="250" y="280" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Learn</text>
  <circle cx="250" cy="242" r="4" fill="#6b6b6b"/>
  <text x="134" y="156" text-anchor="end" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Update</text>
  <circle cx="158" cy="150" r="4" fill="#6b6b6b"/>
  <g><animateTransform attributeName="transform" type="rotate" values="0 250 150;360 250 150;720 250 150;1080 250 150;1440 250 150" keyTimes="0;0.3789;0.6526;0.8526;1.0000" dur="9.5s" begin="-1.8s" repeatCount="indefinite"/>
    <path d="M270.0 150.0 L330.0 150.0" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-linecap="round"/>
    <path d="M240.0 167.3 L210.0 219.3" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-linecap="round"/>
    <path d="M240.0 132.7 L210.0 80.7" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-linecap="round"/>
    <path d="M250.0 58.0 A92 92 0 0 1 340.6 134.0" fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="round"/>
    <circle cx="340.6" cy="134.0" r="5" fill="#000"/>
  </g>
  <text x="250" y="162" text-anchor="middle" font-size="34" font-weight="700" fill="#d8d8d8" opacity="0">v1<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3789;1" dur="9.5s" begin="-1.8s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="250" y="162" text-anchor="middle" font-size="34" font-weight="700" fill="#d8d8d8" opacity="0">v2<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3789;0.6526;1" dur="9.5s" begin="-1.8s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="250" y="162" text-anchor="middle" font-size="34" font-weight="700" fill="#d8d8d8" opacity="0">v3<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.6526;0.8526;1" dur="9.5s" begin="-1.8s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="250" y="162" text-anchor="middle" font-size="34" font-weight="700" fill="#d8d8d8" opacity="0">v4<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.8526;1" dur="9.5s" begin="-1.8s" calcMode="discrete" repeatCount="indefinite"/></text>
  <text x="560" y="64" text-anchor="start" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Cycle Time</text>
  <rect x="560" y="76" width="400" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="560" y="76" width="380" height="22" rx="4" fill="#f97316" fill-opacity="0.9"><animate attributeName="width" values="380;380;270;270;180;180;110;110;380" keyTimes="0.0000;0.3789;0.4189;0.6526;0.6926;0.8526;0.8926;0.9850;1.0000" dur="9.5s" begin="-1.8s" repeatCount="indefinite"/></rect>
  <text x="560" y="142" text-anchor="start" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Failures</text>
  <rect x="560" y="154" width="400" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="560" y="154" width="340" height="22" rx="4" fill="#ef4444" fill-opacity="0.9"><animate attributeName="width" values="340;340;220;220;130;130;70;70;340" keyTimes="0.0000;0.3789;0.4189;0.6526;0.6926;0.8526;0.8926;0.9850;1.0000" dur="9.5s" begin="-1.8s" repeatCount="indefinite"/></rect>
  <text x="560" y="220" text-anchor="start" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">Quality</text>
  <rect x="560" y="232" width="400" height="22" rx="4" fill="#1a1a1a"/>
  <rect x="560" y="232" width="130" height="22" rx="4" fill="#22d3ee" fill-opacity="0.9"><animate attributeName="width" values="130;130;210;210;290;290;380;380;130" keyTimes="0.0000;0.3789;0.4189;0.6526;0.6926;0.8526;0.8926;0.9850;1.0000" dur="9.5s" begin="-1.8s" repeatCount="indefinite"/></rect>
</svg>
