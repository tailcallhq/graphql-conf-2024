<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Space Mono, ui-monospace, Menlo, monospace">
  <!-- Title: In The Loop vs On The Loop | Concept: Top lane, work queues behind a human gate and trickles out one item at a time; bottom lane, the same work streams through untouched while the human just watches from the side. SMIL only, 18s loop -->
  <path d="M40 114 H960" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 246 H960" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="48" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">In The Loop</text>
  <text x="40" y="180" font-size="16" font-weight="700" letter-spacing="2" fill="#d8d8d8">On The Loop</text>
  <text x="960" y="48" text-anchor="end" font-size="16" font-weight="700" letter-spacing="2" fill="#6b6b6b">Waiting</text>
  <text x="960" y="180" text-anchor="end" font-size="16" font-weight="700" letter-spacing="2" fill="#6b6b6b">Shipping</text>
